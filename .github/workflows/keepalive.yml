name: Supabase keep-alive

# Impede o projeto Supabase free tier de pausar por inatividade (~7 dias).
# Roda a cada 3 dias e tambem pode ser disparado manualmente na aba Actions.

on:
  schedule:
    - cron: "17 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install "psycopg2-binary>=2.9.9"

      - name: Ping no banco
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python .github/scripts/keepalive.py
